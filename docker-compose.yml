name: godavari

services:
  godavari:
    build:
      context: .
      args:
        # CPU by default. For a GPU host use docker-compose.gpu.yml instead.
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        INSTALL_CROWD_SHIELD: ${INSTALL_CROWD_SHIELD:-0}
    image: godavari-crowd-monitor:${TAG:-cpu}
    container_name: godavari
    restart: unless-stopped
    stop_grace_period: 20s

    # Published to the loopback interface only: the dashboard has no
    # authentication. Put Caddy/nginx in front for remote access
    # (see docs/DEPLOYMENT.md), or change to "8000:8000" on a trusted LAN.
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"

    environment:
      CROWD_MODEL: ${CROWD_MODEL:-}
      CROWD_CONF: ${CROWD_CONF:-0.30}
      CROWD_IMGSZ: ${CROWD_IMGSZ:-640}
      CROWD_TARGET_INFER_FPS: ${CROWD_TARGET_INFER_FPS:-5}
      CROWD_MAX_FRAME_WIDTH: ${CROWD_MAX_FRAME_WIDTH:-1280}
      CROWD_LOOP: ${CROWD_LOOP:-1}
      CROWD_WARN_PCT: ${CROWD_WARN_PCT:-75}
      CROWD_ALERT_SUSTAIN: ${CROWD_ALERT_SUSTAIN:-5}
      CROWD_ALERT_COOLDOWN: ${CROWD_ALERT_COOLDOWN:-60}
      CROWD_STREAM_FPS: ${CROWD_STREAM_FPS:-12}
      CROWD_DECODER: ${CROWD_DECODER:-auto}
      CROWD_BATCH_SIZE: ${CROWD_BATCH_SIZE:-1}
      CROWD_MAX_BATCH_WAIT_MS: ${CROWD_MAX_BATCH_WAIT_MS:-8}
      CROWD_FRAME_QUEUE_SIZE: ${CROWD_FRAME_QUEUE_SIZE:-2}
      CROWD_POINT_BACKEND: ${CROWD_POINT_BACKEND:-}
      CROWD_POINT_MODEL_VALIDATED: ${CROWD_POINT_MODEL_VALIDATED:-0}
      CROWD_POINT_PERIOD_S: ${CROWD_POINT_PERIOD_S:-1.5}
      CROWD_DENSITY_BACKEND: ${CROWD_DENSITY_BACKEND:-}
      CROWD_DENSITY_VALIDATED: ${CROWD_DENSITY_VALIDATED:-0}
      CROWD_DENSITY_PERIOD_S: ${CROWD_DENSITY_PERIOD_S:-1.5}
      CROWD_VALIDATION_MIN_SAMPLES: ${CROWD_VALIDATION_MIN_SAMPLES:-20}
      CROWD_VALIDATION_MAX_MAPE: ${CROWD_VALIDATION_MAX_MAPE:-0.20}
      CROWD_VALIDATION_TTL_DAYS: ${CROWD_VALIDATION_TTL_DAYS:-30}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_WEBHOOK_RETRIES: ${ALERT_WEBHOOK_RETRIES:-3}
      MONGODB_URL: ${MONGODB_URL:-}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-godavari}
      CROWD_MAX_UPLOAD_BYTES: ${CROWD_MAX_UPLOAD_BYTES:-1073741824}
      CROWD_LOG_JSON: ${CROWD_LOG_JSON:-1}
      TZ: ${TZ:-Asia/Kolkata}

    volumes:
      # cameras.json, uploads, sample clips and the alert database.
      - godavari-data:/app/.data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  godavari-data:
